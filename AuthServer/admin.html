<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrollSpeed 授权管理</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#1d2532;background:#f6f8fc}section{background:white;padding:24px;border-radius:16px;margin:18px 0}input,button{font:inherit;padding:10px;margin:6px;border:1px solid #cad2df;border-radius:8px}button{background:#2459d4;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}#message{color:#9a2c2c}</style><h1>TrollSpeed 授权管理</h1><p>这是重建产品的新授权系统，不能解锁原作者的应用。</p><section><h2>管理员登录</h2><form id="login"><input id="username" autocomplete="username" value="admin" aria-label="管理员账号"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>登录</button></form></section><section id="controls" hidden><h2>发放授权码</h2><form id="issue"><input id="days" type="number" min="1" max="3650" value="30" aria-label="有效天数"><button>生成授权码</button></form><pre id="newkey"></pre><h2>授权列表</h2><button id="refresh">刷新</button><table><thead><tr><th>编号</th><th>到期</th><th>状态</th><th>操作</th></tr></thead><tbody id="licenses"></tbody></table></section><p id="message" role="status"></p><script src="/admin.js" defer></script></html>
