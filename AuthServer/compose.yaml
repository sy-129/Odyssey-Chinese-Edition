services:
  auth:
    build: .
    restart: unless-stopped
    environment:
      TS_AUTH_STATE_DIR: /state
    volumes:
      - ./state:/state
    expose:
      - '8080'
  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
