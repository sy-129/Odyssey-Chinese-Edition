name: Rebuild iOS application
on:
  push:
    branches: ['codex/trollspeed-rebuild']
  workflow_dispatch:
concurrency:
  group: trollspeed-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original image resources
        run: python3 Tools/prepare_resources.py
      - name: Fetch pinned Dear ImGui
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ocornut/imgui.git Vendor/imgui
          git -C Vendor/imgui checkout 6ccc561a2ab497ad4ae6ee1dbd3b992ffada35cb
      - name: Verify portable implementation
        run: make check
      - name: Compare original ARM64 coordinate routines with reconstruction
        run: |
          python3 -m venv build/verification-venv
          build/verification-venv/bin/pip install -r Tools/requirements-verification.txt
          python3 Tools/prepare_original_for_verification.py
          c++ -std=c++17 -O2 -dynamiclib -ICore Core/Geometry.cpp Tools/GeometryBridge.cpp -o build/geometry-bridge.dylib
          c++ -std=c++17 -O2 -dynamiclib -ICore Core/CoordinateAccess.cpp Tools/CoordinateBridge.cpp -o build/coordinate-bridge.dylib
          build/verification-venv/bin/python Tools/compare_geometry.py --binary build/original-arm64.bin --library build/geometry-bridge.dylib --output build/geometry-binary-comparison.json
          build/verification-venv/bin/python Tools/compare_coordinate_vm.py --binary build/original-arm64.bin --library build/coordinate-bridge.dylib --output build/coordinate-binary-comparison.json
      - name: Verify online/offline authorization and Python-to-Swift signatures
        run: |
          build/verification-venv/bin/pip install -r AuthServer/requirements.txt
          build/verification-venv/bin/python AuthServer/selfcheck.py --offline-fixture build/offline-license-fixture.json
          xcrun swiftc -swift-version 5 -O -target "$(uname -m)-apple-macosx12.0" AuthClient/LicenseClient.swift Tests/OfflineLicenseTests.swift -o build/offline-client-checks
          ./build/offline-client-checks build/offline-license-fixture.json
      - name: Generate project and build with Apple SDK
        run: |
          python3 Tools/generate_project.py
          set -o pipefail
          xcodebuild -project TrollSpeedRebuild.xcodeproj -scheme TrollSpeedRebuild -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Ad hoc sign for TrollStore and package
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/TrollSpeedRebuild.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -name '*.dylib' -exec codesign --force --sign - --timestamp=none {} \;
          fi
          /usr/libexec/PlistBuddy -c "Add :ReconstructionCommit string $GITHUB_SHA" "$APP/Info.plist"
          codesign --force --sign - --timestamp=none --entitlements App/Entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --strict "$APP"
          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/
          cd build/package
          zip -q -r ../TrollSpeedRebuild.ipa Payload
          shasum -a 256 ../TrollSpeedRebuild.ipa > ../TrollSpeedRebuild.ipa.sha256
      - name: Verify packaged code, entitlements and original assets
        run: python3 Tools/verify_ipa.py --ipa build/TrollSpeedRebuild.ipa --commit "$GITHUB_SHA" --output build/package-integrity.json
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-sdk-build-log
          path: |
            build/xcodebuild.log
            build/geometry-binary-comparison.json
            build/coordinate-binary-comparison.json
            build/package-integrity.json
      - name: Preserve compiled package
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeedRebuild-unverified-on-device
          path: |
            build/TrollSpeedRebuild.ipa
            build/TrollSpeedRebuild.ipa.sha256
