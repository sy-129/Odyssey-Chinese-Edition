name: Build Odysseus Simplified Chinese
on:
  push:
    paths:
      - 'odysseus-zh-Hans/**'
      - '.github/workflows/odysseus-zh-hans.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odysseus-chinese-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'
      - name: Fetch pinned upstream and apply Chinese changes
        run: |
          git clone --recurse-submodules https://github.com/mirazbakis/Odysseus.git upstream
          git -C upstream checkout 2664dadedf9aca36fda0925a8aada92e2c79323f
          git -C upstream submodule update --init --recursive
          python3 - <<'PY'
          import json,gzip,base64,hashlib,pathlib
          p=json.loads(pathlib.Path('odysseus-zh-Hans/build-payload.json').read_text())
          assert p['commit']=='2664dadedf9aca36fda0925a8aada92e2c79323f'
          raw=gzip.decompress(base64.b64decode(p['data']))
          assert hashlib.sha256(raw).hexdigest()==p['decoded_sha256']
          files=json.loads(raw);assert len(files)==p['files']
          root=pathlib.Path('upstream').resolve()
          for name,text in files.items():
              target=(root/name).resolve()
              assert target.is_relative_to(root) and '.git' not in target.relative_to(root).parts
              target.parent.mkdir(parents=True,exist_ok=True);target.write_text(text)
          PY
          python3 upstream/localization/verify_localization.py
          git -C upstream diff --check
      - name: Prepare UI test project
        working-directory: upstream
        run: |
          gem install --user-install xcodeproj --no-document
          ruby localization/add_ui_tests.rb
      - name: Restore Xcode and Swift build cache
        id: build_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/Odysseus/iphoneos
            ~/Library/Caches/org.swift.swiftpm
          key: odysseus-derived26.4-${{ runner.os }}-${{ hashFiles('upstream/localization/add_ui_tests.rb', 'upstream/localization/UITests/**', 'upstream/**/Package.swift') }}
          restore-keys: odysseus-derived26.4-${{ runner.os }}-
      - name: Compile iPhone IPA
        id: device_build
        working-directory: upstream
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -o pipefail
          make iphoneos 2>&1 | tee build.log
          test -f packages/Odysseus.ipa
      - name: Test Chinese startup and main workflows on iPhone simulator
        working-directory: upstream
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -o pipefail
          DEVICE_ID=$(python3 - <<'PYDEVICE'
          import json,subprocess
          d=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json']))
          available=[r for r in d['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          assert available,'No iOS simulator runtime installed'
          runtime=max(available,key=lambda r:tuple(int(x) for x in r['version'].split('.')))
          identifier=subprocess.check_output(['xcrun','simctl','create','Odysseus Chinese QA','com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro',runtime['identifier']],text=True).strip()
          import pathlib
          pathlib.Path('localization/simulator-runtime.json').write_text(json.dumps({'device':'iPhone 16 Pro','runtime':runtime['name'],'version':runtime['version'],'identifier':identifier},indent=2))
          print(identifier)
          PYDEVICE
          )
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -project Feather.xcodeproj -scheme OdysseusUITests \
            -configuration Release -destination "id=$DEVICE_ID" \
            -derivedDataPath "${RUNNER_TEMP}/Odysseus/iphoneos" \
            -resultBundlePath "${RUNNER_TEMP}/Odysseus-UI.xcresult" \
            -skipPackagePluginValidation -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO DEPLOYMENT_LOCATION=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO 2>&1 | tee ui-test.log
          mkdir -p ../delivery/screenshots
          xcrun xcresulttool export attachments --path "${RUNNER_TEMP}/Odysseus-UI.xcresult" --output-path ../delivery/screenshots
          xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/Odysseus-UI.xcresult" > ../delivery/UI-TEST-SUMMARY.json
          python3 localization/simulator_recovery_check.py "$DEVICE_ID" com.mirazbakis.Odysseus ../delivery/screenshots
          swift localization/recognize_screenshots.swift ../delivery/screenshots
          cp localization/simulator-runtime.json ../delivery/
          ditto -c -k --keepParent ../delivery/screenshots ../delivery/Simulator-Screenshots.zip
      - name: Verify built Chinese resources and package corresponding source
        run: |
          mkdir -p delivery
          cp upstream/packages/Odysseus.ipa delivery/Odysseus-zh-Hans.ipa
          python3 - <<'PY'
          import json,zipfile,plistlib,pathlib,hashlib,subprocess,tempfile
          ipa=pathlib.Path('delivery/Odysseus-zh-Hans.ipa')
          translations=json.loads(pathlib.Path('upstream/localization/translations-zh-Hans.json').read_text())
          with zipfile.ZipFile(ipa) as z, tempfile.TemporaryDirectory() as td:
              assert z.testzip() is None
              z.extractall(td)
              apps=list(pathlib.Path(td,'Payload').glob('*.app'));assert len(apps)==1
              app=apps[0];info=plistlib.loads((app/'Info.plist').read_bytes())
              assert (app/info['CFBundleExecutable']).stat().st_size>0
              locale=app/'zh-Hans.lproj'
              assert locale.is_dir()
              def load(p):
                  return json.loads(subprocess.check_output(['plutil','-convert','json','-o','-',str(p)]))
              strings=load(locale/'Localizable.strings')
              plurals=load(locale/'Localizable.stringsdict') if (locale/'Localizable.stringsdict').exists() else {}
              missing=sorted(set(translations)-set(strings)-set(plurals));assert not missing,missing
              assert load(locale/'InfoPlist.strings')['CFBundleDisplayName']=='奥德赛签名'
              subprocess.run(['codesign','--verify','--strict','--deep',str(app)],check=True)
              subprocess.run(['swift','upstream/localization/check_runtime_formats.swift',str(locale)],check=True)
              report={'source_commit':'2664dadedf9aca36fda0925a8aada92e2c79323f','translated_catalog_keys':len(translations),'built_chinese_keys':len(set(strings)|set(plurals)),'missing_chinese_keys':missing,'bundle_id':info['CFBundleIdentifier'],'minimum_ios':info['MinimumOSVersion'],'ipa_sha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),'xcode_device_build':'passed','strict_bundle_signature':'passed','chinese_runtime_formatting':'passed','simulator_ui_tests':'passed','simulator_database_recovery':'passed','iphone_16_pro_ios_27_0_1_runtime_tested':False}
              pathlib.Path('delivery/BUILD-VERIFICATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          tar --exclude='.git' --exclude='*/.git' --exclude='deps' --exclude='_build' --exclude='packages' --exclude='build.log' --exclude='ui-test.log' -czf delivery/Odysseus-zh-Hans-source.tar.gz -C upstream .
          cp upstream/localization/README.zh-CN.md delivery/README.zh-CN.md
          cd delivery
          shasum -a 256 Odysseus-zh-Hans.ipa Odysseus-zh-Hans-source.tar.gz > SHA256SUMS
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Odysseus-Chinese-build-log-${{ github.run_number }}
          path: |
            upstream/build.log
            upstream/ui-test.log
          if-no-files-found: ignore
      - name: Preserve successful compile cache even when a later test fails
        if: always() && steps.device_build.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/Odysseus/iphoneos
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
      - name: Upload IPA and source
        uses: actions/upload-artifact@v4
        with:
          name: Odysseus-zh-Hans-${{ github.run_number }}
          path: delivery/
          retention-days: 90
      - name: Publish separate Chinese release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "odysseus-zh-hans-${GITHUB_RUN_NUMBER}" delivery/*.ipa delivery/*.gz delivery/*.json delivery/*.md delivery/*.zip delivery/SHA256SUMS \
            --title "Odysseus 简体中文 · 构建 ${GITHUB_RUN_NUMBER}" \
            --notes-file delivery/README.zh-CN.md
