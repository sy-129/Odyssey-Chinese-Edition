name: WQ Resource Glass
on:
  push:
    paths:
      - 'wq-resource-glass/**'
      - '.github/workflows/wq-resource-glass.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wq-resource-glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'
      - name: Restore pinned WQ source and resource workflow changes
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/kolbicz/WQFiles.git
          git -C source fetch --depth 1 origin 4cde7b1f79e0d9f42feb8b60ea4ee975ff14519e
          git -C source checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          d=json.loads(pathlib.Path('wq-resource-glass/build-payload.json').read_text())
          raw=gzip.decompress(base64.b64decode(d['data']))
          assert hashlib.sha256(raw).hexdigest()==d['decoded_sha256']
          files=json.loads(raw)
          for name,text in files.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              target=pathlib.Path('source')/p
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text)
          print('Applied',len(files),'reviewed files')
          PY
          git -C source diff --check
      - name: Prepare actual simulator UI test project
        working-directory: source
        run: |
          gem install --user-install xcodeproj --no-document
          ruby qa/create_project.rb
      - name: Full host regression, real resource file transactions, strict iPhone build
        working-directory: source
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee build.log
          mkdir -p ../delivery
          cp WQFiles.ipa ../delivery/WQResourceGlass.ipa
          cp README.资源注入器.md ../delivery/README.zh-CN.md
      - name: Test native glass, controls, importer, permission feedback and relaunch
        working-directory: source
        run: |
          set -euo pipefail
          DEVICE_ID=$(python3 - <<'PY'
          import json,pathlib,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json']))
          available=[x for x in data['runtimes'] if x.get('isAvailable') and x['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          assert available,'No installed iOS simulator runtime'
          r=max(available,key=lambda x:tuple(int(n) for n in x['version'].split('.')))
          identifier=subprocess.check_output(['xcrun','simctl','create','WQ Resource Glass QA','com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro',r['identifier']],text=True).strip()
          pathlib.Path('../delivery/SIMULATOR.json').write_text(json.dumps({'model':'iPhone 16 Pro','runtime':r['name'],'version':r['version'],'id':identifier},indent=2))
          print(identifier)
          PY
          )
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -project ResourceQA.xcodeproj -scheme ResourceQA -configuration Release \
            -destination "id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/WQResourceQA" \
            -resultBundlePath "$RUNNER_TEMP/WQResourceQA.xcresult" -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES 2>&1 | tee ui-test.log
      - name: Preserve simulator screenshots and results even if a test fails
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/WQResourceQA.xcresult" ]; then exit 0; fi
          mkdir -p ../delivery/screenshots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WQResourceQA.xcresult" --output-path ../delivery/screenshots
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/WQResourceQA.xcresult" > ../delivery/UI-TEST-SUMMARY.json
          ditto -c -k --keepParent ../delivery/screenshots ../delivery/Simulator-Screenshots.zip
      - name: Verify exact IPA and package corresponding GPL source
        run: |
          set -euo pipefail
          python3 source/qa/verify_delivery.py
          tar --exclude='.git' --exclude='*/.git' --exclude='.work' --exclude='WQFiles.ipa' --exclude='ResourceQA.xcodeproj' --exclude='build.log' --exclude='ui-test.log' -czf delivery/WQResourceGlass-source.tar.gz -C source .
          cd delivery
          shasum -a 256 WQResourceGlass.ipa WQResourceGlass-source.tar.gz Simulator-Screenshots.zip > SHA256SUMS
      - name: Preserve failure details and real regression outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WQResourceGlass-logs-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            source/build.log
            source/ui-test.log
            source/.work/tests/**/**.log
            delivery/screenshots/
            delivery/UI-TEST-SUMMARY.json
            delivery/SIMULATOR.json
          if-no-files-found: ignore
      - name: Upload verified IPA, source, screenshots and reports
        uses: actions/upload-artifact@v4
        with:
          name: WQResourceGlass-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: delivery/
      - name: Publish tested preview with measured limitations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          WQ 资源注入器 0.10.0，基于 kolbicz/WQFiles，GPL-3.0-or-later。

          包含中文黑色原生玻璃界面、实时应用身份核对与去重、系统文件原件备份导出、回执检测接口与匹配后还原。

          本次构建已通过原项目回归、新增真实临时文件事务测试、严格iPhone arm64编译和签名校验，以及9项模拟器界面测试。实际模拟器系统见SIMULATOR.json，截图和完整源码在附件中。

          这是公开自测预览版，未标为百分百真机可用。用户设备的App Group令牌、跨应用访问和自动打开需要实际验证；用户游戏插件尚未接入回执，不能宣称游戏内悬浮窗已经开通；后台检测可能暂停。安装目录只读。请先查看BUILD-VERIFICATION.json与中文说明。

          重新签名时需描述文件实际允许并保留App Group；P12本身不保证具备此能力。
          EOF
          gh release create "wq-resource-glass-${GITHUB_RUN_NUMBER}" delivery/*.ipa delivery/*.gz delivery/*.zip delivery/*.json delivery/*.md delivery/SHA256SUMS \
            --prerelease --title "WQ资源注入器 0.10.0 · 自测预览 ${GITHUB_RUN_NUMBER}" --notes-file "$RUNNER_TEMP/release-notes.md"
